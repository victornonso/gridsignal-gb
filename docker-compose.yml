name: gridsignal
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: gridsignal_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WRITER_PASSWORD: ${WRITER_PASSWORD:?Set WRITER_PASSWORD in .env}
      READER_PASSWORD: ${READER_PASSWORD:?Set READER_PASSWORD in .env}
    ports: ["127.0.0.1:5440:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/docker/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridsignal_db"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db/gridsignal_db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      READ_DATABASE_URL: postgresql+psycopg://gridsignal_reader:${READER_PASSWORD}@db/gridsignal_db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      retries: 3
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://gridsignal_writer:${WRITER_PASSWORD}@db/gridsignal_db
    command: ["gridsignal", "worker", "--run-now"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  dashboard:
    build:
      context: apps/dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [api]
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.local
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5051:80"]
  backup:
    image: postgres:18
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["./backups:/backups"]
    entrypoint: ["sh", "-c", "pg_dump -h db -U postgres -Fc gridsignal_db > /backups/gridsignal-$$(date +%Y%m%d-%H%M%S).dump"]
volumes:
  pgdata:

