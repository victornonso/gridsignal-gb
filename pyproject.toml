[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsignal-gb"
version = "0.1.0"
description = "Great Britain electricity intelligence, from official observations to SQL analytics"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "apscheduler>=3.11,<4", "tenacity>=9,<10", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
gridsignal = "pipelines.cli:main"

[tool.setuptools.packages.find]
include = ["pipelines*", "apps.api*"]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests", "db/tests", "apps/api/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

